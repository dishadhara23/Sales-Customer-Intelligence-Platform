# Local PostgreSQL warehouse for the Sales & Customer Intelligence Platform.
#
#   docker compose up -d
#   python -m src.etl.run_pipeline
#
# Matches the DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: olist_warehouse
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olist_pgdata:
